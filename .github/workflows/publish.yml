name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: marketplace-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run check
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - run: node scripts/check-vsix.mjs
      - run: xvfb-run -a npm run test:installed
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run audit
      - run: npm run package
      - run: node scripts/check-vsix.mjs
      - name: Publish the verified VSIX
        run: npx vsce publish --oidc --packagePath "$(node -p "'ash-vscode-tools-' + require('./package.json').version + '.vsix'")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ash-vscode-tools-*.vsix --verify-tag --generate-notes
